<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Редактор мемов</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f6;--card:#fff;--text:#18181b;--muted:#6b7280;--line:#d9d9e0;--accent:#e6207f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121216;--card:#1c1c22;--text:#f2f2f5;--muted:#9a9aa5;--line:#34343e}}
:root[data-theme="dark"]{--bg:#121216;--card:#1c1c22;--text:#f2f2f5;--muted:#9a9aa5;--line:#34343e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:1000px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media(max-width:780px){main{grid-template-columns:1fr}}
h1{margin:0;font-size:22px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:center;align-items:center;min-height:240px}
canvas{display:block;max-width:100%;max-height:75vh;width:auto;height:auto;border-radius:6px}
canvas.on{touch-action:none;cursor:crosshair}
.panel,.tab{display:flex;flex-direction:column;gap:12px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
input[type=range]{width:100%}
textarea,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
textarea{min-height:64px;resize:vertical}
button{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button.primary,.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>button{flex:1}
.hint{font-size:12px;color:var(--muted);margin:0}
</style>
</head>
<body>
<main>
<div style="grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px"><h1>Редактор мемов</h1><nav style="font-size:14px;display:flex;gap:14px"><a href="index.html" style="color:var(--accent)">Заголовки</a><b>Мемы</b></nav></div>
<div class="stage"><canvas id="c" width="800" height="500"></canvas></div>
<div class="panel">
 <button id="pick">Выбрать картинку…</button>
 <input id="file" type="file" accept="image/*" hidden>
 <p class="hint">Или перетащи картинку на страницу, или вставь из буфера (Ctrl+V).</p>
 <div class="row tabs"><button id="be" class="on">Стереть</button><button id="bt">Текст</button><button id="bw">Вотермарк</button></div>

 <div id="te" class="tab">
  <p class="hint">Выдели прямоугольник поверх текста — он закрасится.</p>
  <select id="em"><option value="a">Авто: по краям (и на градиентах)</option><option value="c">Одним цветом</option></select>
  <div class="row"><label style="margin:0">Цвет <input id="ec" type="color" value="#ffffff"></label><button id="un">↶ Отменить</button></div>
 </div>

 <div id="tt" class="tab" hidden>
  <button id="add">＋ Добавить текст</button>
  <p class="hint">Тексты двигаются перетаскиванием. Тап по тексту — выбрать.</p>
  <div id="tb" class="tab" hidden>
   <textarea id="tx"></textarea>
   <div><label>Размер</label><input id="ts" type="range" min="2" max="20" step=".5"></div>
   <select id="tf"><option value="s">Обычный</option><option value="m">Мемный (жирный)</option><option value="c">Комикс</option><option value="r">С засечками</option></select>
   <div class="row"><label style="margin:0">Цвет <input id="tc" type="color"></label><label style="margin:0"><input id="tu" type="checkbox"> ЗАГЛАВНЫЕ</label></div>
   <div class="row"><label style="margin:0"><input id="tst" type="checkbox"> Обводка</label><input id="tsc" type="color"><button id="td">Удалить</button></div>
  </div>
 </div>

 <div id="tw" class="tab" hidden>
  <p class="hint">Вотермарк двигается мышкой или пальцем.</p>
  <div class="row"><button data-p="0,0">↖</button><button data-p="1,0">↗</button><button data-p="0.5,0.5">●</button><button data-p="0,1">↙</button><button data-p="1,1">↘</button></div>
  <div><label>Размер</label><input id="size" type="range" min="8" max="80" value="28"></div>
  <div><label>Прозрачность</label><input id="op" type="range" min="15" max="100" value="100"></div>
 </div>
 <button id="png" class="primary">Скачать PNG</button>
 <button id="jpg">Скачать JPG</button>
</div>
</main>

const FONTS={m:'"Oswald",Impact,sans-serif',s:'system-ui,Arial,sans-serif',c:'"Comic Sans MS","Comic Neue",cursive',r:'Georgia,"Times New Roman",serif'};
const cv=$('c'),ctx=cv.getContext('2d'),bg=document.createElement('canvas'),bx=bg.getContext('2d',{willReadFrequently:true});
let wm,img=null,tab='e',T=[],sel=null,px=.9,py=.9,wsize=.28,op=1,drag=null,rect=null,undo=[],ui=true;
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
const box=()=>{const w=cv.width*wsize;return{w,h:w*wm.height/wm.width}};

function wrap(t,maxW){const out=[];for(const p of t.split('\n')){let l='';for(const w of p.split(/\s+/).filter(Boolean)){const s=l?l+' '+w:w;if(ctx.measureText(s).width>maxW&&l){out.push(l);l=w}else l=s}out.push(l)}return out}
function drawBlock(b){
  const fs=cv.width*b.size/100;
  ctx.font=`${b.f==='m'?700:400} ${fs}px ${FONTS[b.f]}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  const L=wrap(b.up?b.t.toUpperCase():b.t,cv.width*.94),lh=fs*1.15,h=L.length*lh,w=Math.max(1,...L.map(l=>ctx.measureText(l).width));
  const cx=b.x*cv.width,cy=b.y*cv.height;
  L.forEach((l,i)=>{const y=cy-h/2+lh/2+i*lh;if(b.st){ctx.lineWidth=fs*.16;ctx.strokeStyle=b.sc;ctx.strokeText(l,cx,y)}ctx.fillStyle=b.c;ctx.fillText(l,cx,y)});
  b.bb={x:cx-w/2-6,y:cy-h/2-4,w:w+12,h:h+8};
}
function render(){
  if(!wm)return;
  if(img)ctx.drawImage(bg,0,0);
  else{ctx.fillStyle='#3a3a44';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#aaa';ctx.font='20px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText('Перетащи картинку сюда',cv.width/2,60)}
  if(img)T.forEach(drawBlock);
  const{w,h}=box(),mx=w/2/cv.width,my=h/2/cv.height;
  px=Math.min(1-mx,Math.max(mx,px));py=Math.min(1-my,Math.max(my,py));
  ctx.globalAlpha=op;ctx.drawImage(wm,px*cv.width-w/2,py*cv.height-h/2,w,h);ctx.globalAlpha=1;
  if(ui&&img){
    ctx.save();ctx.setLineDash([8,6]);ctx.lineWidth=Math.max(2,cv.width/400);ctx.strokeStyle='#e6207f';
    if(rect)ctx.strokeRect(rect.x0,rect.y0,rect.x1-rect.x0,rect.y1-rect.y0);
    if(tab==='t'&&sel&&sel.bb)ctx.strokeRect(sel.bb.x,sel.bb.y,sel.bb.w,sel.bb.h);
    ctx.restore();
  }
}
function setImage(f){
  if(!f||!f.type.startsWith('image/'))return;
  load(URL.createObjectURL(f)).then(i=>{
    const k=Math.min(1,3000/Math.max(i.width,i.height));
    cv.width=bg.width=Math.round(i.width*k);cv.height=bg.height=Math.round(i.height*k);
    bx.drawImage(i,0,0,bg.width,bg.height);img=i;T=[];sel=null;undo=[];loadUI();
    const M=.03;px=1-M-box().w/2/cv.width;py=1-M-box().h/2/cv.height;cv.classList.add('on');render();
  });
}
/* стирание */
function erase(r){
  let x=Math.floor(Math.min(r.x0,r.x1)),y=Math.floor(Math.min(r.y0,r.y1)),x2=Math.ceil(Math.max(r.x0,r.x1)),y2=Math.ceil(Math.max(r.y0,r.y1));
  x=Math.max(1,x);y=Math.max(1,y);x2=Math.min(bg.width-2,x2);y2=Math.min(bg.height-2,y2);
  const w=x2-x,h=y2-y;if(w<3||h<3)return;
  const id=bx.getImageData(x-1,y-1,w+2,h+2);undo.push({x:x-1,y:y-1,d:new ImageData(new Uint8ClampedArray(id.data),w+2,h+2)});if(undo.length>15)undo.shift();
  const d=id.data,W=w+2,H=h+2;
  if($('em').value==='c'){bx.fillStyle=$('ec').value;bx.fillRect(x,y,w,h);return}
  const at=(i,j,k)=>d[(j*W+i)*4+k];
  for(let j=1;j<=h;j++)for(let i=1;i<=w;i++){
    const tx=i/(W-1),ty=j/(H-1),o=(j*W+i)*4;
    for(let k=0;k<3;k++){const hz=at(0,j,k)*(1-tx)+at(W-1,j,k)*tx,vt=at(i,0,k)*(1-ty)+at(i,H-1,k)*ty;d[o+k]=(hz+vt)/2}
    d[o+3]=255;
  }
  bx.putImageData(id,x-1,y-1);
}
$('un').onclick=()=>{const u=undo.pop();if(u){bx.putImageData(u.d,u.x,u.y);render()}};
/* тексты */
function loadUI(){
  $('tb').hidden=!sel;if(!sel)return;
  $('tx').value=sel.t;$('ts').value=sel.size;$('tf').value=sel.f;$('tc').value=sel.c;$('tu').checked=sel.up;$('tst').checked=sel.st;$('tsc').value=sel.sc;
}
$('add').onclick=()=>{if(!img)return;sel={t:'Текст',x:.5,y:.5,size:6,c:'#000000',f:'s',up:false,st:false,sc:'#000000'};T.push(sel);loadUI();render()};
const bind=(id,key,get)=>$(id).oninput=()=>{if(sel){sel[key]=get($(id));render()}};
bind('tx','t',e=>e.value);bind('ts','size',e=>+e.value);bind('tf','f',e=>e.value);bind('tc','c',e=>e.value);
bind('tu','up',e=>e.checked);bind('tst','st',e=>e.checked);bind('tsc','sc',e=>e.value);
$('td').onclick=()=>{if(sel){T=T.filter(b=>b!==sel);sel=null;loadUI();render()}};
/* вкладки */
function setTab(t){tab=t;[['e','be'],['t','bt'],['w','bw']].forEach(([k,b])=>{$('t'+k).hidden=t!==k;$(b).classList.toggle('on',t===k)});render()}
$('be').onclick=()=>setTab('e');$('bt').onclick=()=>setTab('t');$('bw').onclick=()=>setTab('w');
/* вотермарк */
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
  const M=.03,[fx,fy]=b.dataset.p.split(',').map(Number),{w,h}=box(),mx=M+w/2/cv.width,my=M*cv.width/cv.height+h/2/cv.height;
  px=fx===.5?.5:(fx?1-mx:mx);py=fy===.5?.5:(fy?1-my:my);render()});
$('size').oninput=e=>{wsize=e.target.value/100;render()};
$('op').oninput=e=>{op=e.target.value/100;render()};
/* мышь и палец */
const pt=e=>{const r=cv.getBoundingClientRect(),k=cv.width/r.width;return{x:(e.clientX-r.left)*k,y:(e.clientY-r.top)*k}};
cv.onpointerdown=e=>{
  if(!img)return;cv.setPointerCapture(e.pointerId);const p=pt(e);
  if(tab==='e')rect={x0:p.x,y0:p.y,x1:p.x,y1:p.y};
  else if(tab==='t'){
    const h=[...T].reverse().find(b=>b.bb&&p.x>=b.bb.x&&p.x<=b.bb.x+b.bb.w&&p.y>=b.bb.y&&p.y<=b.bb.y+b.bb.h);
    sel=h||null;loadUI();if(h)drag={p,x:h.x,y:h.y};render();
  } else drag={p,x:px,y:py};
};
cv.onpointermove=e=>{
  const p=pt(e);
  if(rect){rect.x1=p.x;rect.y1=p.y;render()}
  else if(drag){const dx=(p.x-drag.p.x)/cv.width,dy=(p.y-drag.p.y)/cv.height;
    if(tab==='t'&&sel){sel.x=drag.x+dx;sel.y=drag.y+dy}else{px=drag.x+dx;py=drag.y+dy}render()}
};
cv.onpointerup=()=>{if(rect){erase(rect);rect=null;render()}drag=null};
/* файлы */
$('pick').onclick=()=>$('file').click();
$('file').onchange=e=>setImage(e.target.files[0]);
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();setImage(e.dataTransfer.files[0])});
addEventListener('paste',e=>{const f=[...e.clipboardData.files][0];if(f)setImage(f)});
function save(t,x){
  if(!img)return;ui=false;render();
  cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='meme.'+x;a.click()},t,.92);
  ui=true;render();
}
$('png').onclick=()=>save('image/png','png');$('jpg').onclick=()=>save('image/jpeg','jpg');
load(WM_SRC).then(async i=>{wm=i;render();try{await document.fonts.load('700 40px Oswald');render()}catch(e){}});
</script>
