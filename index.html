<!DOCTYPE html>
<html lang="be">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Генератар загалоўкаў</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f6;--card:#fff;--text:#18181b;--muted:#6b7280;--line:#d9d9e0;--accent:#e6207f;--accent-t:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121216;--card:#1c1c22;--text:#f2f2f5;--muted:#9a9aa5;--line:#34343e}}
:root[data-theme="dark"]{--bg:#121216;--card:#1c1c22;--text:#f2f2f5;--muted:#9a9aa5;--line:#34343e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:960px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,500px) minmax(260px,1fr);gap:24px;align-items:start}
@media(max-width:780px){main{grid-template-columns:1fr}}
h1{grid-column:1/-1;margin:0;font-size:22px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
canvas{display:block;width:100%;height:auto;border-radius:6px;cursor:grab;background:#222}
canvas.has-photo{touch-action:none}
canvas:active{cursor:grabbing}
.panel{display:flex;flex-direction:column;gap:14px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
textarea{width:100%;min-height:96px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;resize:vertical}
input[type=range]{width:100%}
button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Генератар карцінак-загалоўкаў</h1>
<div class="stage"><canvas id="c" width="500" height="500"></canvas></div>
<div class="panel">
 <div class="row">
  <button id="pick">Выбраць фота…</button>
  <input id="file" type="file" accept="image/*" hidden>
 </div>
 <p class="hint">Або перацягні фота на карцінку, ці ўстаў з буферу (Ctrl+V). Фота можна перасоўваць мышкай.</p>
 <div><label for="zoom">Маштаб фота</label><input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></div>
 <div><label for="txt">Загаловак</label><textarea id="txt">Bloober Team распрацоўваюць рэмэйк Silent Hill 3</textarea>
 <p class="hint">Enter — свой перанос радка. Без яго тэкст пераносіцца аўтаматычна.</p></div>
 <div><label for="style">Стыль</label><select id="style" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit"><option value="1">1 — арыгінал з PSD</option><option value="2">2 — ніжэй лінія, мякчэйшае свячэнне, чысцейшы шрыфт</option></select></div>
 <button id="dl" class="primary">Спампаваць PNG 1000×1000</button>
 <button id="dl500">Спампаваць PNG 500×500</button>
</div>
</main>

      if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t;
    }
    out.push(line);
  }
  return out;
}
function drawText(){
  const text=document.getElementById('txt').value.trim(); if(!text) return;
  let size=44,lines;
  for(;size>=22;size-=2){
    lines=wrap(text,`italic 700 ${size}px ${FONT}`,TEXT_AREA.w);
    if(lines.length*size*1.18<=TEXT_AREA.bottom-TEXT_AREA.top&&lines.every(l=>ctx.measureText(l).width<=TEXT_AREA.w)) break;
  }
  const lh=size*1.18, h=lines.length*lh;
  const y0=(TEXT_AREA.top+TEXT_AREA.bottom)/2-h/2+lh/2;
  ctx.font=`italic 700 ${size}px ${FONT}`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor='rgb(19,159,210)'; ctx.shadowBlur=BLUR*ctx.getTransform().a; ctx.fillStyle='#fff';
  lines.forEach((l,i)=>{for(let k=0;k<PASSES;k++)ctx.fillText(l,TEXT_AREA.x,y0+i*lh)});
  ctx.shadowBlur=0; ctx.shadowColor='transparent';
  lines.forEach((l,i)=>ctx.fillText(l,TEXT_AREA.x,y0+i*lh));
}
function clamp(){
  if(!photo) return;
  const k=Math.max(S/photo.width,S/photo.height)*zoom, w=photo.width*k, h=photo.height*k;
  ox=Math.min(0,Math.max(S-w,ox)); oy=Math.min(0,Math.max(S-h,oy));
}
function render(){
  ctx.globalCompositeOperation='source-over'; ctx.clearRect(0,0,S,S);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,S,S);
  if(photo){
    const k=Math.max(S/photo.width,S/photo.height)*zoom;
    ctx.drawImage(photo,ox,oy,photo.width*k,photo.height*k);
  } else {
    ctx.fillStyle='#3a3a44'; ctx.fillRect(0,0,S,S);
    ctx.fillStyle='#aaa'; ctx.font=`16px ${FONT}`; ctx.textAlign='center'; ctx.fillText('Перацягні фота сюды',S/2,120);
  }
  ctx.globalCompositeOperation='darken'; ctx.drawImage(grad,0,0);
  ctx.globalCompositeOperation='source-over'; ctx.drawImage(bar,0,BAR_Y);
  drawText();
}
function setPhoto(file){
  if(!file||!file.type.startsWith('image/')) return;
  const url=URL.createObjectURL(file);
  load(url).then(i=>{photo=i;cv.classList.add('has-photo');zoom=1;document.getElementById('zoom').value=1;
    const k=Math.max(S/i.width,S/i.height);ox=(S-i.width*k)/2;oy=(S-i.height*k)/2;render()});
}
document.getElementById('pick').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>setPhoto(e.target.files[0]);
document.getElementById('txt').oninput=render;
document.getElementById('zoom').oninput=e=>{
  if(!photo) return;
  const old=Math.max(S/photo.width,S/photo.height)*zoom; zoom=+e.target.value;
  const nw=Math.max(S/photo.width,S/photo.height)*zoom, r=nw/old;
  ox=S/2-(S/2-ox)*r; oy=S/2-(S/2-oy)*r; clamp(); render();
};
let drag=null;
cv.onpointerdown=e=>{if(!photo)return;cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,ox,oy}};
cv.onpointermove=e=>{if(!drag)return;const f=S/cv.getBoundingClientRect().width;
  ox=drag.ox+(e.clientX-drag.x)*f; oy=drag.oy+(e.clientY-drag.y)*f; clamp(); render()};
cv.onpointerup=()=>drag=null;
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();setPhoto(e.dataTransfer.files[0])});
addEventListener('paste',e=>{const f=[...e.clipboardData.files][0];if(f)setPhoto(f)});
const F1=FONT, STYLES={1:{a:{x:250,w:410,top:292,bottom:462},y:250,b:10,p:3,f:F1},2:{a:{x:250,w:420,top:328,bottom:470},y:288,b:6,p:2,f:'"Fira Sans","Franklin Gothic Medium","Segoe UI",Arial,sans-serif'}};
document.getElementById('style').onchange=e=>{const s=STYLES[e.target.value];TEXT_AREA=s.a;BAR_Y=s.y;BLUR=s.b;PASSES=s.p;FONT=s.f;render()};
function exportPNG(px){
  const off=document.createElement('canvas');off.width=off.height=px;
  const main=ctx; ctx=off.getContext('2d'); ctx.imageSmoothingQuality='high'; ctx.scale(px/S,px/S);
  render(); ctx=main;
  off.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='news-header-'+px+'.png';a.click()},'image/png');
}
document.getElementById('dl').onclick=()=>exportPNG(1000);
document.getElementById('dl500').onclick=()=>exportPNG(500);
Promise.all([load(GRAD),load(BAR)]).then(async([g,b])=>{
  grad=g;bar=b;
  try{await Promise.all([document.fonts.load(`italic 700 30px "Fira Sans"`),document.fonts.load(`italic 600 30px "Fira Sans"`)])}catch(e){}
  render();
});
</script>
